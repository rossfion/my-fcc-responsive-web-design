<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Painting</title>
    <style>
        #house {
            position: relative;
            width: 500px;
            height: 400px;
            background-color: #000;
            border: 3px solid orangered;
            top: 100px;
            left: 150px;
        }

        #chimney,
        #roof,
        #window-1,
        #window-2,
        #door {
            position: absolute;
        }

        #chimney {
            width: 100px;
            height: 200px;
            background-color: brown;
            border: 3px solid orangered;
            top: -200px;
            left: 255px;
            z-index: -1;
        }

        #roof {
            width: 500px;
            height: 100px;
            background-color: brown;
            border: 1px solid orangered;
            top: 0;
        }

        #window-1,
        #window-2 {
            width: 100px;
            height: 100px;
            background-color: hotpink;
            border: 1px solid orangered;
        }

        #door {
            width: 120px;
            height: 160px;
            background-color: hotpink;
            border: 1px solid orangered;
            bottom: 0;
            left: 180px;
        }

        #window-1 {
            top: 150px;
            left: 30px;
        }

        #window-2 {
            top: 150px;
            left: 350px;
        }
    </style>
</head>

<body>
    
    <div id="house">
        <div id="chimney"></div>
        <div id="roof"></div>
        <div id="window-1"></div>
        <div id="window-2"></div>
        <div id="door"></div>
        </house>
    </div>

</body>

</html>
