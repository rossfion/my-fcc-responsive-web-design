<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feature Selection Page</title>
    <style>
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            appearance: none;
            border: 2px solid #f1be32;
            border-radius: 4px;
            background-color: white;
            vertical-align: middle;
            margin-right: 15px;
        }

        input[type='checkbox']:checked {
            background-color: #f1be32;
            border-color: #e2a60d;
        }

        input[type="checkbox"]:checked::after {
            content: "✓";
            display: block;
            text-align: center;
            background-color: orange;
            border-color: midnightblue;
        }
    </style>
</head>

<body>
    <h1>Feature Selection</h1>
    <div class="feature-card-container">
        <label class="feature-card"><input type="checkbox" />Cloud Storage</label>
        <label class="feature-card"><input type="checkbox" />Dedicated Support</label>
        <label class="feature-card"><input type="checkbox" />Custom User Themes</label>
        <label class="feature-card"><input type="checkbox" />Multi-User Collaboration</label>
    </div>
</body>

</html>
