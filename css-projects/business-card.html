<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design a Business Card</title>
    <style>
        body {
            background-color: rosybrown;
            font-family: Arial, sans-serif;
        }

        p {
            margin-top: 5px;
            margin-bottom: 5px;
        }

        a {
            text-decoration: none;
            padding: 3px;
            /* added May 30, 2026 */
        }

        .business-card {
            width: 300px;
            background-color: beige;
            padding: 20px;
            margin-top: 100px;
            text-align: center;
            font-size: 16px;
            margin-left: auto;
            margin-right: auto;
        }

        .profile-image {
            max-width: 100%;
        }
    </style>
</head>

<body>
    <div class="business-card">
        <img class="profile-image" src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg" alt="pink dandelion" />
        <p class="full-name">Fionn Ross</p>
        <p class="designation">Software Developer</p>
        <p class="company">Fionn Ross Online</p>
        <hr />
        <p>fionn@fionnrossonline.com</p>
        <p>410-991-9868</p><a href="https://fionnrossonline.com/onlineportfolio/" class="portfolio-link"
            target="_blank">Portfolio</a>
        <hr>
        <div class="social-media">
            <h2>Connect with me</h2>
            <a href="https://www.twitter.com" target="_blank">Twitter</a>
            <a href="https://www.linkedin.com/in/fionnross/" target="_blank">LinkedIn</a>
            <a href="https://github.com/rossfion" target="_blank">GitHub</a>
        </div>
    </div>
</body>

</html>
