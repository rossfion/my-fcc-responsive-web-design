<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Availability Table</title>
    <style>
        :root {
            --color0: #ffffff;
            --color1: #cccccc;
            --color2: #5ff356;
            --color3: #c83838;
            --color4: #6b6e24;
            --color5: #000000;
            --solid-border: 1px solid black;
            --dashed-border: 1px dashed black;

        }

        .available-0 {
            background-color: var(--color0);
        }

        .available-1 {
            background-color: var(--color1);
        }

        .available-2 {
            background-color: var(--color2);
        }

        .available-3 {
            background-color: var(--color3);
        }

        .available-4 {
            background-color: var(--color4);
        }

        .available-5 {
            background-color: var(--color5);
        }

        .sharp td {
            border-bottom: var(--solid-border);
        }

        .half td {
            border-bottom: var(--dashed-border);
        }

        #legend-gradient {
            display: block;
            width: 100px;
            height: 20px;
            background-image: linear-gradient(90deg,
                    var(--color0) 0% 19%,
                    var(--color1) 20% 39%,
                    var(--color2) 40% 59%,
                    var(--color3) 60% 69%,
                    var(--color4) 70% 89%,
                    var(--color5) 90% 100%);

        }
    </style>
</head>

<body>
    <table>
        <caption>Availability</caption>
        <thead>
            <tr>
                <th></th>
                <th>Monday</th>
                <th>Tuesday</th>
                <th>Wednesday</th>
                <th>Thursday</th>
                <th>Friday</th>
                <th>Saturday</th>
                <th>Sunday</th>
            </tr>
        </thead>
        <tbody>

            <tr class="sharp">
                <th class="time">9.00 am</th>
                <td class="available-0"></td>
                <td class="available-1"></td>
                <td class="available-2"></td>
                <td class="available-3"></td>
                <td class="available-4"></td>
                <td class="available-5"></td>
                <td class="available-4"></td>
            </tr>
            <tr class="half">
                <th class="time">10.00 am</th>

                <td class="available-3"></td>
                <td class="available-2"></td>
                <td class="available-1"></td>
                <td class="available-0"></td>
                <td class="available-1"></td>
                <td class="available-2"></td>
                <td class="available-3"></td>

            </tr>
            <tr class="sharp">
                <th class="time">11.00 am</th>

                <td class="available-4"></td>
                <td class="available-5"></td>
                <td class="available-4"></td>
                <td class="available-3"></td>
                <td class="available-2"></td>
                <td class="available-1"></td>
                <td class="available-0"></td>
            </tr>
            <tr class="half">
                <th class="time">12.00 noon</th>

                <td class="available-2"></td>
                <td class="available-0"></td>
                <td class="available-1"></td>
                <td class="available-2"></td>
                <td class="available-3"></td>
                <td class="available-2"></td>
                <td class="available-1"></td>
            </tr>
            <tr class="sharp">
                <th class="time">1.00 pm</th>

                <td class="available-2"></td>
                <td class="available-0"></td>
                <td class="available-1"></td>
                <td class="available-2"></td>
                <td class="available-3"></td>
                <td class="available-2"></td>
                <td class="available-1"></td>
            </tr>
            <tr class="half">
                <th class="time">2.00 pm</th>

                <td class="available-2"></td>
                <td class="available-3"></td>
                <td class="available-4"></td>
                <td class="available-5"></td>
                <td class="available-4"></td>
                <td class="available-3"></td>
                <td class="available-3"></td>
            </tr>
            <tr class="sharp">
                <th class="time">3.00 pm</th>

                <td class="available-4"></td>
                <td class="available-5"></td>
                <td class="available-5"></td>
                <td class="available-5"></td>
                <td class="available-5"></td>
                <td class="available-4"></td>
                <td class="available-4"></td>
                <td class="available-3"></td>
            </tr>
            <tr class="half">
                <th class="time">4.00 pm</th>

                <td class="available-4"></td>
                <td class="available-5"></td>
                <td class="available-4"></td>
                <td class="available-5"></td>
                <td class="available-4"></td>
                <td class="available-3"></td>
                <td class="available-3"></td>
            </tr>
            <tr class="sharp">
                <th class="time">5.00 pm</th>
                <td class="available-5"></td>
                <td class="available-5"></td>
                <td class="available-4"></td>
                <td class="available-4"></td>
                <td class="available-3"></td>
                <td class="available-0"></td>
                <td class="available-0"></td>
            </tr>

        </tbody>
    </table>
    <div id="legend">
        <span>Availability</span>
        <div id="legend-gradient"></div>
    </div>
</body>

</html>
